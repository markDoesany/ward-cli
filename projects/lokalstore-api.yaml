schema_version: 1

project:
  id: lokalstore-api
  name: LokalStore API
  description: Local LokalStore API development profile

environments:
  development:
    kind: development
    api:
      base_url_env: WARD_LOKALSTORE_API_URL
    services:
      - name: LokalStore session endpoint
        type: http
        url: /api/auth/session
        expected_status: 401
    database:
      enabled: false
      driver: mysql
    redaction:
      fields:
        - token
        - password
        - secret
        - cookie
        - session_id
      patterns:
        - '(?i)session_id=[^\s]+'
