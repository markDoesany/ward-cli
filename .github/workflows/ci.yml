name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ward
          MYSQL_USER: ward
          MYSQL_PASSWORD: ward-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run MySQL integration test
        env:
          WARD_TEST_MYSQL_HOST: 127.0.0.1
          WARD_TEST_MYSQL_PORT: 3306
          WARD_TEST_MYSQL_DATABASE: ward
          WARD_TEST_MYSQL_USER: ward
          WARD_TEST_MYSQL_PASSWORD: ward-password
        run: go test ./internal/database -run TestMySQLReadOnlyIntegration -count=1 -v

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, mysql-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/ward/ward/cmd.version=0.2.0 -X github.com/ward/ward/cmd.commit=${GITHUB_SHA} -X github.com/ward/ward/cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/ward-${GOOS}-${GOARCH}${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ward-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
